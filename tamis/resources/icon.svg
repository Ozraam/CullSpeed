<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tamis app icon. Source of the window icon and of the macOS .icns built by scripts/build_app.sh.
       Follows the macOS grid: an 824px rounded square centred on a 1024px canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="skyBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#374151"/>
    </linearGradient>
    <clipPath id="frontPhoto">
      <rect x="352" y="300" width="400" height="300" rx="14"/>
    </clipPath>
    <clipPath id="backPhoto">
      <rect x="352" y="300" width="400" height="300" rx="14"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <g transform="translate(-28 -28)">
  <!-- Speed lines -->
  <g stroke-linecap="round" fill="none">
    <line x1="180" y1="400" x2="290" y2="400" stroke="#3b82f6" stroke-width="22" stroke-opacity="0.9"/>
    <line x1="220" y1="470" x2="300" y2="470" stroke="#3b82f6" stroke-width="22" stroke-opacity="0.6"/>
    <line x1="200" y1="540" x2="290" y2="540" stroke="#3b82f6" stroke-width="22" stroke-opacity="0.35"/>
  </g>

  <!-- Rejected print, tilted behind -->
  <g transform="rotate(-12 552 470)">
    <rect x="322" y="270" width="460" height="400" rx="26" fill="#d4d4d4"/>
    <g clip-path="url(#backPhoto)">
      <rect x="352" y="300" width="400" height="300" fill="url(#skyBack)"/>
      <path d="M352 600 L470 470 L540 540 L620 440 L752 600 Z" fill="#1f2937"/>
    </g>
  </g>

  <!-- Kept print, in front -->
  <g transform="rotate(5 552 520) translate(40 60)">
    <rect x="322" y="270" width="460" height="400" rx="26" fill="#000000" fill-opacity="0.35" transform="translate(0 14)"/>
    <rect x="322" y="270" width="460" height="400" rx="26" fill="#fafafa"/>
    <g clip-path="url(#frontPhoto)">
      <rect x="352" y="300" width="400" height="300" fill="url(#sky)"/>
      <circle cx="670" cy="370" r="34" fill="#facc15"/>
      <path d="M352 600 L470 450 L545 530 L630 420 L752 600 Z" fill="#1e3a8a"/>
      <path d="M352 600 L440 530 L520 580 L600 520 L752 600 Z" fill="#172554"/>
    </g>
  </g>

  <!-- Keep badge -->
  <circle cx="742" cy="742" r="112" fill="#0c0c0c"/>
  <circle cx="742" cy="742" r="96" fill="#4ade80"/>
  <path d="M694 744 L728 778 L792 712" fill="none" stroke="#0c0c0c" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
