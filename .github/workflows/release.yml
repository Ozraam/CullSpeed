name: Release

# Pushing a tag such as v0.2.0 builds, signs and notarizes Tamis.app and
# publishes the DMG as a GitHub release. The tag must match pyproject.toml's version.
#
# Secrets (from an Apple Developer account):
#   MACOS_CERTIFICATE           the "Developer ID Application" certificate and key, as a base64 .p12
#   MACOS_CERTIFICATE_PASSWORD  the .p12's password
#   MACOS_SIGN_IDENTITY         "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY                  an App Store Connect API key, as a base64 .p8
#   NOTARY_KEY_ID, NOTARY_ISSUER  that key's id and issuer id

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[build,dev]"
      - run: ruff check .
      - run: pytest
      - name: Check the tag against the version
        run: |
          version=$(python -c "import tamis; print(tamis.__version__)")
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml" >&2
            exit 1
          fi
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - run: ./scripts/build_app.sh
      - name: Sign, notarize and package
        env:
          TAMIS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TAMIS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          TAMIS_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          export TAMIS_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY" | base64 --decode > "$TAMIS_NOTARY_KEY"
          ./scripts/package_macos.sh
          rm "$TAMIS_NOTARY_KEY"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Tamis-*.dmg --title "Tamis ${GITHUB_REF_NAME#v}" --generate-notes
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
